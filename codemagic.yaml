workflows:
  ios-kmp-workflow:
    name: Build KMP iOS App (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17  # Codemagic natively sets up Java 17 for the environment here
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcworkspace" # Adjust if you use .xcodeproj
        XCODE_SCHEME: "iosApp"

    scripts:
      - name: Build Kotlin shared framework
        script: |
          chmod +x gradlew
          ./gradlew build

      - name: Build iOS Simulator binary
        script: |
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - build/ios/iphonesimulator/*.app

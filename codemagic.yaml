workflows:
  ios-kmp-workflow:
    name: Build KMP iOS App (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2   # Runs on cloud macOS servers

    environment:
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcworkspace" # Adjust path if using .xcodeproj
        XCODE_SCHEME: "iosApp"

    scripts:
      - name: Set Java version
        script: |
          jdk default 17

      - name: Build Kotlin shared framework
        script: |
          chmod +x gradlew
          ./gradlew :shared:build

      - name: Build iOS Simulator binary (Checks for compilation errors)
        script: |
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - build/ios/iphonesimulator/*.app
